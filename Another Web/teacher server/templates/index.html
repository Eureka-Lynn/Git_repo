<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>机房学生管理系统</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
    body {
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
  background: #f0f2f5;
}

/* 左侧控制栏 */
#sidebar {
  width: 260px;
  background: #ffffff;
  border-right: 1px solid #ddd;
  padding: 20px;
  overflow-y: auto;
  box-shadow: 2px 0 5px rgba(0,0,0,0.05);
}

#sidebar h3 {
  margin-top: 0;
  color: #333;
  font-size: 18px;
  border-bottom: 1px solid #eee;
  padding-bottom: 10px;
}

#sidebar button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background: linear-gradient(135deg, #4a90e2, #357ab7);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
#sidebar button:hover {
  filter: brightness(1.07);
}

/* 主内容区 */
#main {
  flex: 1;
  padding: 20px 40px;
  overflow: auto;
}

#main h2 {
  font-weight: 500;
  color: #333;
  margin-top: 0;
}

/* 六列布局 */
#seatGrid {
  display: flex;
  justify-content: center;
  gap: 70px;
  padding-top: 20px;
}

/* 单列 */
.column {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 两侧 */
.side-group {
  display: flex;
  gap: 30px;
}

/* 四个座位垂直排列 */
.side-column {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* 单个座位（卡片风格） */
.seat {
  width: 120px;
  height: 65px;
  border-radius: 10px;
  background: #ffffff;
  border: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: 13px;
  text-align: center;
  position: relative;
  transition: all 0.15s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

.seat.online {
  background: #e7ffe7;
  border-color: #84d984;
}

.seat.hand {
  background: #e7f1ff;
  border-color: #7db8ff;
  box-shadow: 0 0 10px rgba(100,150,255,0.8);
}

.cancel-btn {
  position: absolute;
  bottom: 4px;
  right: 4px;
  font-size: 10px;
  padding: 2px 5px;
  background: #ff6b6b;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
.cancel-btn:hover {
  filter: brightness(1.1);
}

/* Debug Panel */
#debugPanel {
  width: 300px;
  background: rgba(0,0,0,0.85);
  color: #0f0;
  padding: 12px;
  border-left: 2px solid #444;
  font-size: 12px;
  overflow-y: auto;
  white-space: pre-wrap;
  backdrop-filter: blur(4px);
}

</style>
</head>
<body>

<!-- 左侧控制栏 -->
<div id="sidebar">
  <h3>控制</h3>
  <button id="cancelAllBtn">全部放下举手</button>
</div>

<!-- 中间主内容区域 -->
<div id="main">
  <h2>机房座位图</h2>
  <div id="seatGrid"></div>
</div>

<!-- 右侧 Debug Log 面板 -->
<div id="debugPanel"></div>

<script>
/* 最终确认的座位布局（六列，从左到右） */
const seatLayout = [
  { right: ["STU-045","STU-046","STU-047","STU-048"], left: ["STU-041","STU-042","STU-043","STU-044"] },
  { right: ["STU-037","STU-038","STU-039","STU-040"], left: ["STU-033","STU-034","STU-035","STU-036"] },
  { right: ["STU-029","STU-030","STU-031","STU-032"], left: ["STU-025","STU-026","STU-027","STU-028"] },
  { right: ["STU-021","STU-022","STU-023","STU-024"], left: ["STU-017","STU-018","STU-019","STU-020"] },
  { right: ["STU-013","STU-014","STU-015","STU-016"], left: ["STU-009","STU-010","STU-011","STU-012"] },
  { right: ["STU-005","STU-006","STU-007","STU-008"], left: ["STU-001","STU-002","STU-003","STU-004"] }
];

let students = {};  // { client_id: {...} }
const debugPanel = document.getElementById('debugPanel');

/* 追加 Debug Log */
function log(msg) {
  debugPanel.textContent += msg + "\n";
  debugPanel.scrollTop = debugPanel.scrollHeight;
}

/* 渲染整个六列布局 */
function renderGrid() {
  const grid = document.getElementById("seatGrid");
  grid.innerHTML = "";

  seatLayout.forEach(col => {
    const colDiv = document.createElement("div");
    colDiv.className = "column";

    const sideGroup = document.createElement("div");
    sideGroup.className = "side-group";

    // 右侧（靠教师）
    const rightColumn = document.createElement("div");
    rightColumn.className = "side-column";
    col.right.forEach(cid => rightColumn.appendChild(createSeat(cid)));

    // 左侧
    const leftColumn = document.createElement("div");
    leftColumn.className = "side-column";
    col.left.forEach(cid => leftColumn.appendChild(createSeat(cid)));

    sideGroup.appendChild(rightColumn);
    sideGroup.appendChild(leftColumn);
    colDiv.appendChild(sideGroup);

    grid.appendChild(colDiv);
  });
}

/* 创建座位元素 DOM */
function createSeat(cid) {
  const seat = document.createElement("div");
  seat.className = "seat";
  seat.id = "seat-" + cid;

  updateSeatContent(seat, students[cid], cid);

  return seat;
}

/* 更新单个座位显示 */
function updateSeatContent(seat, info, cid) {
  seat.className = "seat";

  if (info) {
    if (info.online) seat.classList.add("online");
    if (info.hand_raised) seat.classList.add("hand");
  }

  seat.innerHTML = info
    ? `${info.name}<br>${info.student_id}`
    : cid;

  const btn = document.createElement("button");
  btn.className = "cancel-btn";
  btn.textContent = "放下";
  btn.onclick = () => cancelSingle(cid);
  seat.appendChild(btn);
}

/* 后端返回更新某个学生后刷新 */
function updateSeat(cid) {
  const seat = document.getElementById("seat-" + cid);
  if (!seat) return;
  updateSeatContent(seat, students[cid], cid);
}

/* 单个放下举手 */
function cancelSingle(cid) {
  fetch(`/cancel_hand_raise/${cid}`, { method: "POST" })
    .then(() => log(`取消单个举手: ${cid}`));
}

/* 全部放下 */
document.getElementById("cancelAllBtn").onclick = () => {
  fetch("/cancel_all", { method: "POST" }).then(() => log("取消全部举手"));
};

/* Socket.IO 接收学生状态变动 */
const socket = io();
socket.on("mqtt_message", msg => {
  log("收到: " + JSON.stringify(msg));
  const data = msg.data;
  students[data.client_id] = data;
  updateSeat(data.client_id);
});

/* ------------------------------ */
/*  ⭐ 重要：页面加载时同步后端状态  */
/* ------------------------------ */
async function loadInitialStudents() {
  try {
    const res = await fetch("/students");
    const list = await res.json();
    list.forEach(s => {
      students[s.client_id] = s;
      updateSeat(s.client_id);
    });
    log("初始化同步完成，共载入 " + list.length + " 个学生");
  } catch (e) {
    log("初始化学生失败: " + e);
  }
}

/* 初始渲染 + 从后端同步状态 */
renderGrid();
loadInitialStudents();

</script>
</body>
</html>
