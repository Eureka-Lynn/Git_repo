<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>机房学生管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  /* 放下按钮定位 */
  .cancel-btn {
    position: absolute;
    bottom: 0.25rem;
    right: 0.25rem;
  }
</style>
</head>
<body class="flex h-screen overflow-hidden font-sans bg-gray-100">

<!-- 中间主内容区域 -->
<div id="main" class="flex-1 p-5 flex flex-col items-center overflow-hidden">
  <h2 class="text-xl font-medium text-gray-800 mb-4">机房座位图</h2>

  <!-- 中央控制按钮 -->
  <button id="cancelAllBtn" class="py-3 px-6 mb-4 rounded-lg bg-gradient-to-r from-blue-500 to-blue-700 text-white shadow hover:brightness-110 transition-all">
    全部放下举手
  </button>

  <!-- 座位网格 -->
  <div id="seatGrid" class="grid grid-cols-6 gap-4 justify-center overflow-x-auto p-2 w-full"></div>
</div>

<!-- 右侧 Debug Log 面板 -->
<div id="debugPanel" class="w-72 bg-black bg-opacity-85 text-green-400 p-3 border-l border-gray-700 text-xs overflow-y-auto whitespace-pre-wrap backdrop-blur-sm"></div>

<script>
/* ---------------------- 座位布局 ---------------------- */
const seatLayout = [
  { right: ["STU-045","STU-046","STU-047","STU-048"], left: ["STU-041","STU-042","STU-043","STU-044"] },
  { right: ["STU-037","STU-038","STU-039","STU-040"], left: ["STU-033","STU-034","STU-035","STU-036"] },
  { right: ["STU-029","STU-030","STU-031","STU-032"], left: ["STU-025","STU-026","STU-027","STU-028"] },
  { right: ["STU-021","STU-022","STU-023","STU-024"], left: ["STU-017","STU-018","STU-019","STU-020"] },
  { right: ["STU-013","STU-014","STU-015","STU-016"], left: ["STU-009","STU-010","STU-011","STU-012"] },
  { right: ["STU-005","STU-006","STU-007","STU-008"], left: ["STU-001","STU-002","STU-003","STU-004"] }
];

let students = {};  
const debugPanel = document.getElementById('debugPanel');

/* 追加 Debug Log */
function log(msg) {
  debugPanel.textContent += msg + "\n";
  debugPanel.scrollTop = debugPanel.scrollHeight;
}

/* 渲染整个六列布局 */
function renderGrid() {
  const grid = document.getElementById("seatGrid");
  grid.innerHTML = "";

  seatLayout.forEach(col => {
    const colDiv = document.createElement("div");
    colDiv.className = "flex flex-col gap-2";

    const sideGroup = document.createElement("div");
    sideGroup.className = "flex gap-2";

    const rightColumn = document.createElement("div");
    rightColumn.className = "flex flex-col gap-2";
    col.right.forEach(cid => rightColumn.appendChild(createSeat(cid)));

    const leftColumn = document.createElement("div");
    leftColumn.className = "flex flex-col gap-2";
    col.left.forEach(cid => leftColumn.appendChild(createSeat(cid)));

    sideGroup.appendChild(rightColumn);
    sideGroup.appendChild(leftColumn);

    colDiv.appendChild(sideGroup);
    grid.appendChild(colDiv);
  });
}

/* 创建座位元素 DOM */
function createSeat(cid) {
  const seat = document.createElement("div");
  seat.className = "seat w-28 h-16 bg-white rounded-lg shadow flex items-center justify-center relative";
  seat.id = "seat-" + cid;
  updateSeatContent(seat, students[cid], cid);
  return seat;
}

/* 更新单个座位显示 */
function updateSeatContent(seat, info, cid) {
  seat.className = "seat w-28 h-16 rounded-lg shadow flex items-center justify-center relative";

  if (info) {
    if (info.online) seat.classList.add("bg-green-100");
    if (info.hand_raised) seat.classList.add("bg-blue-100", "animate-pulse");
  }

  seat.innerHTML = info ? `${info.name}<br>${info.student_id}` : cid;

  // 举手状态显示按钮
  if (info && info.hand_raised) {
    const btn = document.createElement("button");
    btn.className = "cancel-btn bg-red-500 text-white text-xs px-1 py-0.5 rounded hover:brightness-110 transition-all";
    btn.textContent = "放下";
    btn.onclick = () => cancelSingle(cid);
    seat.appendChild(btn);
  }
}

/* 后端返回更新某个学生后刷新 */
function updateSeat(cid) {
  const seat = document.getElementById("seat-" + cid);
  if (!seat) return;
  updateSeatContent(seat, students[cid], cid);
}

/* 单个放下举手 */
function cancelSingle(cid) {
  fetch(`/cancel_hand_raise/${cid}`, { method: "POST" })
    .then(() => log(`取消单个举手: ${cid}`));
}

/* 全部放下 */
document.getElementById("cancelAllBtn").onclick = () => {
  fetch("/cancel_all", { method: "POST" }).then(() => log("取消全部举手"));
};

/* Socket.IO 接收学生状态变动 */
const socket = io();
socket.on("mqtt_message", msg => {
  log("收到: " + JSON.stringify(msg));
  const data = msg.data;
  students[data.client_id] = data;
  updateSeat(data.client_id);
});

/* 页面加载时同步后端状态 */
async function loadInitialStudents() {
  try {
    const res = await fetch("/students");
    const list = await res.json();
    list.forEach(s => {
      students[s.client_id] = s;
      updateSeat(s.client_id);
    });
    log("初始化同步完成，共载入 " + list.length + " 个学生");
  } catch (e) {
    log("初始化学生失败: " + e);
  }
}

/* 初始渲染 + 同步状态 */
renderGrid();
loadInitialStudents();
</script>

</body>
</html>
